# This workflow only runs when a tag matching the pattern "v*" is pushed,
# AND all tests in the tests workflow have passed successfully (see run-tests.yml).
name: Export & Release
on:
  push:
    tags:
      - "v*"

jobs:
  # Always run the tests workflow first.
  trigger_tests:
    name: Trigger Tests Workflow
    uses: ./.github/workflows/run-tests.yml
    # Required to prevent "HttpError: Resource not accessible by integration" errors.
    permissions: write-all
    with:
      # Provide the required github_ref value to the tests workflow.
      github_ref: ${{ github.ref }}
    # Provide any necessary secrets to the tests workflow.
    secrets: inherit

  export_game:
    name: Export Game

    # This job runs on the latest Ubuntu version.
    runs-on: ubuntu-latest

    # Require tests workflow to finish before running this job.
    needs: trigger_tests

    # Only continue if all tests in the tests workflow passed.
    #
    # Normally the tests workflow itself will fail if any tests failed,
    # causing this workflow to also fail.
    #
    # However, if no tests fail but anything else goes wrong in the tests
    # workflow, it may complete successfully, but 'tests_passed' will be false
    # if it can't verify that aren't any '<failure' tags in an existing xml report.
    #
    # The tests workflow will also fail if a test xml report cannot be found.
    if: needs.trigger_tests.outputs.tests_passed == 'true'

    # Add permissions for release creation. This can be narrowed down if needed.
    permissions: write-all

    steps:
      # Check out the repository so the project files are available.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the entire commit history.
          fetch-depth: 0

      - name: Write build_info.json
        shell: bash
        run: |
          VER=$(git describe --tags --always --dirty || echo "0.0.0")
          SHA=$(git rev-parse --short HEAD)
          TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN=${GITHUB_RUN_NUMBER:-0}
          mkdir -p build
          cat > build/build_info.json <<EOF
          { "version":"$VER", "commit":"$SHA", "run":"$RUN", "time":"$TIME" }
          EOF
          # Move into project so it’s included in export:
          mv build/build_info.json res://build/build_info.json 2>/dev/null || true
          cp build/build_info.json ./build/build_info.json || true

      # Remove the addons directory before the build, to avoid failing the
      # build with this error:
      # "Error: The process '/home/runner/.local/share/godot/godot_executable/Godot_v4.6-stable_mono_linux_x86_64/Godot_v4.6-stable_mono_linux.x86_64' failed with exit code null"
      - name: Remove addons directory
        run: rm -rf addons/

      # Remove .gdignore from json maps directory so they get included in the exports.
      # The .gdignore file prevents the Godot editor from continually auto-formatting the JSON map files,
      # which causes issues during development.
      - name: Remove .gdignore from json maps
        run: rm -f assets/json/maps/.gdignore

      # Export the game using firebelley/godot-export with the specified Godot executable & templates.
      - name: Export game
        id: export
        uses: firebelley/godot-export@master
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_mono_linux_x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_mono_export_templates.tpz
          relative_project_path: ./
          relative_export_path: ./my/build/destination
          archive_output: true
          archive_root_folder: false
          cache: false
          use_preset_export_path: false
          export_debug: false
          verbose: false
          use_godot_3: false
          export_as_pack: false

      # Sign and notarize the macOS app using rcodesign (works from Linux)
      # These steps are optional - if they fail, the unsigned macOS build will still be included
      - name: Extract macOS app for signing
        continue-on-error: true
        id: extract_macos
        run: |
          cd ${{ steps.export.outputs.archive_directory }}
          # Find the macOS zip file (should be named something like "macOS.zip")
          MACOS_ZIP=$(ls -1 | grep -i macos | grep -i .zip | head -n 1)
          echo "Found macOS archive: $MACOS_ZIP"
          # Extract it
          unzip -q "$MACOS_ZIP"
          # Find the .app bundle
          APP_BUNDLE=$(find . -name "*.app" -maxdepth 2 -print -quit)
          echo "Found app bundle: $APP_BUNDLE"
          echo "MACOS_ZIP=$MACOS_ZIP" >> $GITHUB_ENV
          echo "APP_BUNDLE=$APP_BUNDLE" >> $GITHUB_ENV

      - name: Setup signing credentials
        if: steps.extract_macos.outcome == 'success'
        continue-on-error: true
        run: |
          # Download rcodesign
          curl -L https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.28.0/apple-codesign-0.28.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          # Create the P12 certificate file from base64
          echo '${{ secrets.APPLE_CERTIFICATE_P12 }}' | base64 -d > certificate.p12
          # Create the .p8 private key file
          echo '${{ secrets.APPLE_API_KEY_CONTENT }}' > AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          # Use rcodesign to encode the API key into proper JSON format
          ./apple-codesign-0.28.0-x86_64-unknown-linux-musl/rcodesign encode-app-store-connect-api-key \
            -o api-key.json \
            "${{ secrets.APPLE_API_ISSUER }}" \
            "${{ secrets.APPLE_API_KEY }}" \
            AuthKey_${{ secrets.APPLE_API_KEY }}.p8
          # Clean up the private key file
          rm AuthKey_${{ secrets.APPLE_API_KEY }}.p8

      - name: Sign and notarize macOS app
        if: steps.extract_macos.outcome == 'success'
        continue-on-error: true
        id: sign_macos
        uses: indygreg/apple-code-sign-action@v1
        with:
          input_path: ${{ steps.export.outputs.archive_directory }}/${{ env.APP_BUNDLE }}
          p12_file: certificate.p12
          p12_password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          app_store_connect_api_key_json_file: api-key.json
          notarize: true
          staple: true

      - name: Re-archive signed macOS app
        if: steps.sign_macos.outcome == 'success'
        continue-on-error: true
        run: |
          cd ${{ steps.export.outputs.archive_directory }}
          # Remove the original unsigned zip
          rm -f "$MACOS_ZIP"
          # Create new zip with signed app
          APP_NAME=$(basename "$APP_BUNDLE")
          zip -qr "$MACOS_ZIP" "$APP_NAME"
          # Clean up the extracted app
          rm -rf "$APP_NAME"
          echo "Created signed archive: $MACOS_ZIP"

      - name: Print signing status
        run: |
          if [ "${{ steps.sign_macos.outcome }}" == "success" ]; then
            echo "✅ macOS app was signed and notarized successfully"
          else
            echo "⚠️  macOS signing skipped or failed - unsigned build will be included in release"
          fi

      # Create a release using the ncipollo/release-action.
      - name: Create GitHub release
        uses: ncipollo/release-action@v1.20.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
